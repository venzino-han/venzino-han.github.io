- title: Research Experience
  type: time_table
  contents:
    - title: Researcher
      institution: KAIST Knowledge System Lab
      logo: kaist.svg
      year: 2022.03 – Present
      description:
        - title: "Joint R&D with a Semiconductor Inspection Equipment Company: AI Agents & Vision Inspection [DeepSeers] — Project Lead"
          contents:
            - Led the project on tool-calling reliability of on-device small language model (SLM) agents for equipment control, where network access and large external models are not available
            - Built a Mock-API sandbox mimicking the equipment interfaces and a benchmark expanded by an LLM from human-defined seed scenarios, enabling large-scale tool-calling experiments and failure analysis without the real equipment
            - Found through failure analysis that planning (which tools to combine, in what order) was the bottleneck; designed a harness that separates planning (with tool/equipment retrieval) from execution
            - Added execution verification and consistency-based selection over multiple independent rollouts, substantially improving the SLM's tool-calling performance and stability without relying on larger models
            - Developed equipment-knowledge RAG and verification mechanisms to improve AI-agent response reliability
            - Research on zero-shot defect-type classification using pretrained vision models, including VLMs and SAM3
        - title: LLM-based Learning Process Simulation [Creverse] — Project Lead
          contents:
            - Led a team of second-year undergraduates as an "AI-native" team, splitting the work into independently verifiable units (data construction, model development, experiments & evaluation)
            - Developed LLM-based question and item analysis methods
            - Developed LLM-based student simulation methods
            - Built a web-based visualization and verification tool for data, model outputs, simulation, and evaluation results, reducing verification time and communication overhead with the client
        - title: Language-Model-based Learning Content Recommendation [Chunjae Education]
          contents:
            - Developed LLM-based learning-content recommendation methods
            - Built a database of learning topics and activities from lecture-video summarization
            - Built semantic recommendation systems using KoBERT and Qwen-Reranker
        - title: Language-Model-based Automated Essay Scoring [KAIST-KT Joint Research Project]
          contents:
            - Served as project manager and model developer
            - Developed a generative-language-model-based multi-trait essay scoring model
            - Outperformed existing SOTA essay-scoring models while improving memory efficiency and inference speed
            - Achieved strong generalization to essays written for previously unseen prompts
            - Developed a lightweight essay-scoring model and conducted a PoC with the Gyeonggi Provincial Office of Education
        - title: AI-based Learning Recommendation for Self-Directed Learning [KAIST-KT Joint Research Project]
          contents:
            - Served as project manager and model developer
            - Developed graph neural network (GNN)-based knowledge tracing methods
            - Developed recommendation algorithms integrating graph neural networks and natural language processing
            - Developed knowledge-graph construction methods for career recommendation
        - title: AI-based Real Estate Valuation System
          contents:
            - Led project management and developed data analytics/processing systems and backend services
            - Developed algorithms and a web application for data-driven real estate valuation
            - Built data collection and preprocessing modules for real-estate-related news and commercial-district data
            - Developed KeyBERT-based keyword analysis and OpenAI API-based detection of positive real-estate news signals
            - Developed the web application backend using Docker, FastAPI, and MySQL
        - title: Image Generation for Tire Load-Test Simulation [Hankook Tire]
          contents:
            - Conducted model design and performance analysis
            - Developed image-generation methods to replace tire-footprint images captured during load testing
            - Applied CLIP and GAN models to generate images conditioned on tire load-test variables and experimental settings
            - Improved performance over the existing algorithm while substantially reducing testing costs

