# ------------------------------------------------------------------ About (hero)
profile:
  name: Donghee Han
  name_alt: 한동희
  role: AI Research Engineer
  affiliation: Ph.D. Candidate · KAIST Graduate School of Data Science
  bio: |
    I am an AI research engineer and a Ph.D. candidate at the **KAIST Graduate School of Data Science**
    (Knowledge System Lab), expected to graduate in February 2027. My strength is **structuring complex
    problems and carrying them through to results**. My research spans **LLMs, recommender systems, and the
    reliability and safety of AI agents**, with 29 publications at venues including NeurIPS, EMNLP, ACL,
    CIKM, SIGIR, CVPR, and MICCAI.

    Alongside research, I have led industry–academia projects that turn research ideas into systems that work
    on real data and in real environments. Before graduate school, I worked in industry on data engineering,
    analytics-platform R&D, and data-driven market analysis at Buzzvil, Tmax A&C, and LG Hausys.
  interests_title: Research interests
  interests:
    - Large Language Models
    - Recommender Systems
    - Agentic AI · Reliability & Safety
    - Natural Language Processing
    - Graph Neural Networks
    - Multimodal / Medical AI
  how_title: How I work
  how:
    - icon: flask
      title: Design what to train and how to verify it
      text: Model performance is decided less by architecture than by what a model learns from and how it is validated, so I build data, sandboxes, benchmarks, and evaluation as one connected system.
    - icon: magnifying-glass-chart
      title: Turn failures into testable hypotheses
      text: Instead of relying on intuition, I decompose the data, categorize failure cases, and trace whether a problem comes from data preparation or from training — then fix it there.
    - icon: people-group
      title: AI-native teamwork
      text: I split work into independently verifiable units with clear owners, and build tools that let teammates and clients inspect results directly, speeding up both development and communication.
    - icon: face-laugh-beam
      title: Stamina and humor
      text: I have kept a steady pace through long, high-intensity stretches of running research and industry projects in parallel, and delivered results even under less-than-ideal conditions — limited compute, small and less-experienced teams, and tight timelines. The tougher the situation, the more I use humor to keep the team positive and candid.

# ------------------------------------------------------------------ Research & expertise
research:
  title: Research & Expertise
  lead: From LLM-based recommendation and reliable AI agents to large-scale data platforms — research ideas taken all the way to working systems.
  groups:
    - title: AI Research & Machine Learning Engineering
      items:
        - icon: wand-magic-sparkles
          title: LLM-based Recommendation Systems
          desc: Research and development of high-performance, efficient LLM-based recommendation architectures using reinforcement learning (GRPO), LLM reasoning distillation, and simulation-based data curation.
        - icon: robot
          title: Agentic AI, Reliability & Safety
          desc: Reliable tool calling for on-device agents, agent routing, verification-aware early stopping, Text-to-SQL, and retrieval-augmented generation pipelines designed for reliability and safety.
        - icon: circle-nodes
          title: Graph Neural Networks & Multimodal / Medical AI
          desc: Research on GNN-based recommendation and knowledge tracing, image-based medical diagnosis, and multimodal generative models.
        - icon: microchip
          title: Industry R&D & Semiconductor AI
          desc: Joint research with semiconductor inspection equipment company DeepSeers on AI agents and vision inspection; led PM, core-module development, PoC, and commercialization efforts with KT, Hankook Tire, Chunjae Education, and Creverse.
    - title: Data & Software Engineering
      items:
        - icon: diagram-project
          title: Large-Scale Distributed Data Pipelines
          desc: Engineered advertising big-data platforms and real-time/batch data pipelines using AWS, Kubernetes, and Airflow; implemented data quality management and data catalog systems.
        - icon: server
          title: ML Serving & Backend Development
          desc: Built lightweight model inference services and backend systems using FastAPI, Docker, and MySQL.
        - icon: cloud
          title: Cloud Infrastructure & DevOps
          desc: Implemented infrastructure as code (IaC) with Terraform and CI/CD automation.
        - icon: gauge-high
          title: AI Infrastructure & GPU Optimization
          desc: Built and operated multi-GPU servers and workstations, administered Linux systems, and improved engineering productivity with modern AI development tools.
  stack_title: Tools & Technologies
  stack:
    - name: LLM & NLP
      items: [GRPO, RAG, LangChain, ChromaDB, "PEFT (Q-LoRA)", OpenAI API, BERT, KoBERT, KeyBERT, Qwen-Reranker]
    - name: Vision & Multimodal
      items: [VLM, SAM3, CLIP, GAN]
    - name: Graph ML
      items: [GNN, Knowledge Graph, Knowledge Tracing]
    - name: Data Engineering
      items: [AWS, Kubernetes, Airflow, Great Expectations, Amundsen, Tableau, Redash, Jenkins]
    - name: Backend & DevOps
      items: [FastAPI, Docker, MySQL, Terraform, CI/CD, Linux]

