awards:
  title: 수상
  items:
    - title: 창의상
      event: K-DS 컨퍼런스 해커톤
      date: 2023.11.30
      summary: K-DS 컨소시엄 주관 컨퍼런스 해커톤 수상
      bullets:
        - KoAlpaca 기반 자체 LLM 서비스 개발 (대화형 한국사 학습도구)
        - PEFT(Q-LoRA) 기법을 활용하여 한국사 관련 데이터 학습
        - Key-Value 기반의 핵심용어 중심 RAG 구현 (ChromaDB & FastAPI)
    - title: 최우수상
      event: AI 에듀 해커톤
      date: 2023.08.27
      bullets:
        - OpenAI API(GPT-3.5)를 활용한 논술형 문항 생성 및 채점 어플리케이션 개발
        - 기존 출제 문항 및 전공 관련 지식을 RAG로 활용하여 새로운 문항 생성
        - 모범답안과 관련 지식을 바탕으로 서술형 답안 채점 및 학습자 기록 기반 합격확률 예측
        - LangChain을 활용하여 VectorDB(Chroma)와 GPT-3.5를 통합, In-context learning 구현
    - title: 우수상
      event: 판교 AI CAMP · 자연어처리 부문
      date: 2021.09.01
      bullets:
        - BERT 기반 소상공인 QnA 대화 분류 모델 개발 (3위)
        - 질문과 답변 텍스트로 구성된 대화 데이터(375K)를 118개의 카테고리로 분류
        - 데이터 증강기법 및 모델 앙상블을 통한 성능 향상
        - 소수 클래스 데이터에 대해 대화의 일부만을 사용하는 방식으로 데이터 불균형 문제 해결
    - title: 최우수상
      event: SKT AI 해커톤
      date: 2017.08.27
      bullets:
        - NVIDIA Jetson board를 활용한 스마트 미러 개발
        - 표정 인식 모델 학습 및 표정에 따른 적절한 콘텐츠를 제공하는 어플리케이션 개발

