# ------------------------------------------------------------------ 소개
profile:
  name: 한동희
  name_alt: Donghee Han
  role: AI Research Engineer
  affiliation: KAIST 데이터사이언스대학원 박사과정 · 2027.02 졸업예정
  bio: |
    **KAIST 데이터사이언스대학원** Knowledge System Lab에서 연구하고 있는 박사과정생(2027년 2월 졸업예정)이자
    AI 리서치 엔지니어입니다. 저의 강점은 **복잡한 문제를 구조화하고, 끝까지 실행하여 결과로 만드는 능력**입니다.
    **LLM, 추천 시스템, AI 에이전트의 신뢰성·안전성**을 연구하며, NeurIPS, EMNLP, ACL, CIKM, SIGIR, CVPR, MICCAI 등
    국제우수학회 및 SCIE 저널에 총 29편의 논문을 발표했습니다.

    연구와 함께 여러 산학 과제를 리드하며, 연구 아이디어를 실제 데이터와 환경에서 동작하는 시스템으로 구현해 왔습니다.
    대학원 진학 전에는 버즈빌, 티맥스에이앤씨, LG하우시스에서 광고 빅데이터 플랫폼 구축, 데이터 분석 플랫폼 연구개발,
    데이터 기반 시장 분석 업무를 수행했습니다.
  interests_title: 연구 관심 분야
  interests:
    - 대규모 언어모델 (LLM)
    - 추천 시스템
    - 에이전트 신뢰성 · 안전성
    - 자연어처리
    - 그래프 신경망
    - 멀티모달 · 의료 AI
  how_title: 일하는 방식
  how:
    - icon: flask
      title: 무엇을 학습시키고 어떻게 검증할지 설계합니다
      text: AI 모델의 성능은 모델 구조만으로 결정되지 않고, 학습 데이터와 검증 방식을 설계하는 과정에서 크게 결정된다고 생각합니다. 데이터 구축, 샌드박스, 벤치마크, 평가 체계를 하나의 시스템으로 연결해 설계합니다.
    - icon: magnifying-glass-chart
      title: 실패를 검증 가능한 가설로 바꿉니다
      text: 감에 의존하기보다 데이터를 분해하고 실패 사례를 유형화하여, 문제가 데이터 준비와 모델 학습 중 어디에서 발생했는지 추적하고 개선합니다.
    - icon: people-group
      title: AI Native 방식으로 협업합니다
      text: 업무를 독립적으로 검증 가능한 단위로 나누어 명확한 산출물을 맡기고, 팀원과 고객이 결과를 직접 확인할 수 있는 도구를 만들어 개발과 의사소통의 속도를 함께 높입니다.
    - icon: face-laugh-beam
      title: 체력과 유머가 있습니다
      text: 장기간의 연구와 여러 기업 과제를 병행하는 고강도 업무 상황에서도 흔들림 없이 페이스를 유지해 왔고, 제한된 연산 자원, 경험이 많지 않은 소수 인원, 촉박한 일정 같은 불비한 여건에서도 방법을 찾아 끝까지 결과를 만들어 냈습니다. 상황이 어려울수록 유머로 팀 분위기를 긍정적으로 만들어, 구성원들이 솔직하게 의견을 나눌 수 있는 환경을 만듭니다.

# ------------------------------------------------------------------ 연구 분야
research:
  title: 연구 분야 및 역량
  lead: LLM 기반 추천과 신뢰할 수 있는 AI 에이전트 연구부터 대규모 데이터 플랫폼 구축까지, 연구를 실제로 동작하는 시스템으로 만듭니다.
  groups:
    - title: AI 연구 · 머신러닝 엔지니어링
      items:
        - icon: wand-magic-sparkles
          title: LLM-based Recommendation System
          desc: 강화학습(GRPO), LLM 추론 능력 증류, 시뮬레이션 데이터 큐레이션 등 고성능·고효율 LLM 기반 추천 아키텍처 연구 및 개발
        - icon: robot
          title: 에이전틱 AI · 신뢰성 · 안전성
          desc: On-Device 에이전트의 안정적인 Tool-calling, 에이전트 라우팅, 검증 기반 조기 중단 메커니즘, Text-to-SQL 등 신뢰성·안전성을 높인 복합 추론 및 검색 증강 생성 파이프라인 설계
        - icon: circle-nodes
          title: Graph Neural Networks & Multimodal / Medical AI
          desc: GNN 기반 추천 및 지식추적, 이미지 기반 의료 진단 및 멀티모달 생성 모델 연구
        - icon: microchip
          title: 산학 R&D & Semiconductor AI
          desc: 반도체 검사장비 기업 DeepSeers와 AI 에이전트·비전검사 공동연구 수행. KT, 한국타이어, 천재교육, 크레버스 등 산학 프로젝트에서 PM·핵심 모듈 개발 및 PoC/상용화 주도
    - title: 데이터 · 소프트웨어 엔지니어링
      items:
        - icon: diagram-project
          title: 대규모 분산 데이터 파이프라인 구축
          desc: 광고 빅데이터 플랫폼 데이터 엔지니어링. AWS, Kubernetes, Airflow 기반 실시간/배치 데이터 수집·가공 파이프라인 구축 및 운영, 데이터 품질 관리 및 데이터 카탈로그 구축
        - icon: server
          title: ML Serving & 백엔드 개발
          desc: FastAPI, Docker, MySQL 기반의 경량화 모델 추론 서빙 및 백엔드 시스템 개발
        - icon: cloud
          title: 클라우드 인프라 & DevOps
          desc: Terraform을 활용한 IaC, CI/CD 자동화
        - icon: gauge-high
          title: AI 인프라 및 GPU 환경 최적화
          desc: Multi-GPU 서버/워크스테이션 환경 구축, 리눅스 시스템 관리 및 최신 개발 도구를 활용한 엔지니어링 생산성 극대화
  stack_title: 기술 스택
  stack:
    - name: LLM · NLP
      items: [GRPO, RAG, LangChain, ChromaDB, "PEFT (Q-LoRA)", OpenAI API, BERT, KoBERT, KeyBERT, Qwen-Reranker]
    - name: 비전 · 멀티모달
      items: [VLM, SAM3, CLIP, GAN]
    - name: 그래프 ML
