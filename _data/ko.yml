          detail: 1_semiconductor_agent
          bullets:
            - 네트워크·외부 대형 모델 사용이 어려운 장비 환경에서 On-Device 소형 언어모델(SLM) 에이전트의 Tool-calling 안정성과 실행 신뢰성을 높이는 프로젝트 리드
