- title: 수상
  type: time_table
  contents:
    - title: K-DS 컨퍼런스 해커톤 창의상
      institution: K-DS 컨소시엄
      year: 2023.11
      description:
        - KoAlpaca 기반 자체 LLM 서비스 개발 (대화형 한국사 학습도구)
        - PEFT(Q-LoRA) 기법을 활용하여 한국사 관련 데이터 학습
        - Key-Value 기반의 핵심용어 중심 RAG 구현 (ChromaDB & FastAPI)
    - title: AI 에듀 해커톤 최우수상
      year: 2023.08
      description:
        - OpenAI API(GPT-3.5)를 활용한 논술형 문항 생성 및 채점 어플리케이션 개발
        - 기존 출제 문항 및 전공 관련 지식을 RAG로 활용하여 새로운 문항 생성
        - 모범답안과 관련 지식을 바탕으로 서술형 답안 채점 및 학습자 기록 기반 합격확률 예측
        - LangChain을 활용하여 VectorDB(Chroma)와 GPT-3.5를 통합, In-context learning 구현
    - title: 판교 AI CAMP 자연어처리 부문 우수상
      year: 2021.09
      description:
