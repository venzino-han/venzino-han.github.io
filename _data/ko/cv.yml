        - 질문과 답변 텍스트로 구성된 대화 데이터(375K)를 118개의 카테고리로 분류
        - 데이터 증강기법 및 모델 앙상블을 통한 성능 향상
        - 소수 클래스 데이터에 대해 대화의 일부만을 사용하는 방식으로 데이터 불균형 문제 해결
    - title: SKT AI 해커톤 최우수상
      year: 2017.08
      description:
