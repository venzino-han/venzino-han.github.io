<header class="site-header" id="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ home_url }}#about" aria-label="{{ d.profile.name }}">
      <span class="brand-mark" aria-hidden="true">{{ c.initials }}</span>
      <span class="brand-name">{{ d.profile.name }}</span>
    </a>

    <nav class="site-nav" id="site-nav" aria-label="{{ ui.menu }}">
      <ul>
        {%- for section in site.sections %}
        {%- if d[section] or section == "about" %}
        <li><a class="nav-link" href="{% unless page.is_home %}{{ home_url }}{% endunless %}#{{ section }}" data-section="{{ section }}">{{ ui.nav[section] }}</a></li>
        {%- endif %}
        {%- endfor %}
      </ul>
    </nav>

    <div class="header-actions">
      {% include lang-switch.html %}
      <button type="button" class="icon-btn" id="theme-toggle" aria-label="{{ ui.theme }}" title="{{ ui.theme }}">
        <i class="fas fa-moon icon-moon" aria-hidden="true"></i>
        <i class="fas fa-sun icon-sun" aria-hidden="true"></i>
      </button>
      <button type="button" class="icon-btn only-desktop" id="print-button" aria-label="{{ ui.print }}" title="{{ ui.print }}">
        <i class="fas fa-print" aria-hidden="true"></i>
      </button>
      <button type="button" class="icon-btn nav-toggle" id="nav-toggle" aria-controls="site-nav" aria-expanded="false" aria-label="{{ ui.menu }}">
        <i class="fas fa-bars icon-open" aria-hidden="true"></i>
        <i class="fas fa-xmark icon-close" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</header>
